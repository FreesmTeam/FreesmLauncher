name: Build Application

on:
  push:
    branches-ignore:
      - "renovate/**"
      - "docs/**"
    paths-ignore:
      - "docs"
      - "**.md"
      - "flake.lock"
      - "packages"
      - ".github/ISSUE_TEMPLATE"
      - ".markdownlint"
  pull_request:
    paths-ignore:
      - "docs"
      - "**.md"
      - "flake.lock"
      - "packages"
      - ".github/ISSUE_TEMPLATE"
      - ".markdownlint"
  workflow_dispatch:

jobs:
  build_debug:
    name: Build Debug
    uses: ./.github/workflows/build.yml
    with:
      build_type: Debug
      is_qt_cached: true
