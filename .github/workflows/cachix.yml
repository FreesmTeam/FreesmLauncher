name: "Cachix build"
on:
  push:
    branches-ignore:
      - "renovate/**"
      - "docs/**"
    paths-ignore:
      - "docs"
      - "**.md"
      - "packages"
      - ".github/ISSUE_TEMPLATE"
      - ".markdownlint"
  pull_request:
    paths-ignore:
      - "docs"
      - "**.md"
      - "flake.lock"
      - "packages"
      - ".github/ISSUE_TEMPLATE"
      - ".markdownlint"
  workflow_dispatch:

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Warn if Cachix token is missing
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::warning::CACHIX_AUTH_TOKEN is not available; skipping Cachix push."
          fi
      - uses: cachix/cachix-action@v17
        with:
          name: freesmlauncher
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build
      - run: |
          nix develop
          echo "OK"
