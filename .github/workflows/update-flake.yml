---
name: Update Flake Lockfile

on:
  schedule:
    # run weekly on sunday
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    if: github.repository == 'FreesmTeam/FreesmLauncher'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/flake-checker-action@v5
      - uses: DeterminateSystems/update-flake-lock@v24
        with:
          commit-msg: "chore(nix): update `flake.lock` via CI/CD"
          pr-title: "chore(nix): update `flake.lock`"
          pr-labels: |
            [0] : Freesm
            [1] : Nix-related
            [2] : Chore (other)
            [3] : Priority: Low
            [4] : Complexity: Easy
            [5] : Status: Done
            [6] : Platform: Linux
            [6] : Platform: macOS
            [7] : Component: Code (other)
            [8] : User: End-Users
            [9] : Bug: None
            [10] : Pull Request
          git-author-name: John Nix
          git-author-email: github-actions[bot]@users.noreply.github.com
          git-commiter-name: John Nix
          git-commiter-email: github-actions[bot]@users.noreply.github.com
          pr-reviewers: |
            s0me1newithhand7s
         
